[project]
name = "aegisflow"
version = "0.1.0"
description = "AI-based network attack forecasting from network traffic data (SIH26153, Team CyberVanguard)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
aegisflow = "aegisflow.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-v"

[tool.setuptools.packages.find]
include = ["aegisflow*"]
