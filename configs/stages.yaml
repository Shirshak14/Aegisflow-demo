# Dataset-label -> normalized attack class -> inferred attack stage.
# This mapping is a documented PROXY, not ground truth. Every dataset label
# used by an adapter must appear here or ingestion raises LabelMappingError.
#
# label_type meanings (surfaced in the dashboard so nobody mistakes a proxy for a fact):
#   "ground_truth"  -> the dataset's own benign/attack-name label (dataset_label / normalized_attack_class)
#   "inferred"      -> AegisFlow's attack_stage column, derived via this file's mapping

stages_order:
  - "Benign"
  - "Reconnaissance"
  - "Initial Access"
  - "Lateral Movement"
  - "Command and Control"
  - "Exfiltration"
  - "Impact"

cic_ids2017:
  BENIGN:
    normalized_attack_class: "Benign"
    attack_stage: "Benign"
    confidence: "ground_truth"
  PortScan:
    normalized_attack_class: "Reconnaissance"
    attack_stage: "Reconnaissance"
    confidence: "inferred"
    note: "Port scanning is a classic recon technique; direct mapping is reasonably strong."
  FTP-Patator:
    normalized_attack_class: "Brute Force"
    attack_stage: "Initial Access"
    confidence: "inferred"
  SSH-Patator:
    normalized_attack_class: "Brute Force"
    attack_stage: "Initial Access"
    confidence: "inferred"
  "Web Attack – Brute Force":
    normalized_attack_class: "Web Attack"
    attack_stage: "Initial Access"
    confidence: "inferred"
  "Web Attack – XSS":
    normalized_attack_class: "Web Attack"
    attack_stage: "Initial Access"
    confidence: "inferred"
  "Web Attack – Sql Injection":
    normalized_attack_class: "Web Attack"
    attack_stage: "Initial Access"
    confidence: "inferred"
  Infiltration:
    normalized_attack_class: "Infiltration"
    attack_stage: "Lateral Movement"
    confidence: "inferred"
    note: "CIC-IDS2017 documentation describes this as an internal foothold/pivot scenario."
  Heartbleed:
    normalized_attack_class: "Heartbleed"
    attack_stage: "Lateral Movement"
    confidence: "inferred"
    note: "Modeled as credential/memory-disclosure exploitation enabling lateral movement; weak proxy."
  Bot:
    normalized_attack_class: "Botnet"
    attack_stage: "Command and Control"
    confidence: "inferred"
  DoS:
    normalized_attack_class: "Denial of Service"
    attack_stage: "Impact"
    confidence: "inferred"
  DoS slowloris:
    normalized_attack_class: "Denial of Service"
    attack_stage: "Impact"
    confidence: "inferred"
  DoS Slowhttptest:
    normalized_attack_class: "Denial of Service"
    attack_stage: "Impact"
    confidence: "inferred"
  DoS Hulk:
    normalized_attack_class: "Denial of Service"
    attack_stage: "Impact"
    confidence: "inferred"
  DoS GoldenEye:
    normalized_attack_class: "Denial of Service"
    attack_stage: "Impact"
    confidence: "inferred"
  DDoS:
    normalized_attack_class: "Denial of Service"
    attack_stage: "Impact"
    confidence: "inferred"

# CTU-13 (opt-in, aegisflow/ml/datasets/ctu_13.py). The adapter reduces the hundreds of
# fine CTU labels to their family; the raw label stays in the ctu_label column.
ctu_13:
  Botnet:
    normalized_attack_class: "Botnet"
    attack_stage: "Command and Control"
    confidence: "inferred"
    note: "Every flow from an infected host; includes C2, spam, click fraud, scans and DDoS. Same class as CIC-IDS2017 'Bot'."
  Normal:
    normalized_attack_class: "Benign"
    attack_stage: "Benign"
    confidence: "ground_truth"
  Background:
    normalized_attack_class: "Benign"
    attack_stage: "Benign"
    confidence: "inferred"
    note: "Unverified university traffic, not confirmed benign. Counted as non-attack so windows are not flagged by it."

# DARPA OpTC (opt-in, aegisflow/ml/datasets/optc.py). Labels come from the corrected
# host ground truth: flows of red-team processes (and their children) are Malicious.
optc:
  Malicious:
    normalized_attack_class: "APT"
    attack_stage: "Lateral Movement"
    confidence: "inferred"
    note: "Red-team process traffic in scenarios 1-3 (PowerShell Empire, DeathStar, malicious upgrade); includes C2, discovery, lateral movement and exfiltration. Stage is the dominant one, not per flow."
  Benign:
    normalized_attack_class: "Benign"
    attack_stage: "Benign"
    confidence: "inferred"
    note: "Not a red-team process per the corrected ground truth; the labels are not official and may miss activity."

# LANL 2015 flows (opt-in, aegisflow/ml/datasets/lanl_2015.py). The ground truth is a list
# of red-team authentications; flows are matched to it by (source, destination) pair.
lanl_2015:
  RedTeam:
    normalized_attack_class: "APT"
    attack_stage: "Lateral Movement"
    confidence: "inferred"
    note: "Flow from a red-team source computer to a computer it authenticated to as red team, from first red-team auth minus contact_slack_s."
  RedTeamSource:
    normalized_attack_class: "APT"
    attack_stage: "Command and Control"
    confidence: "inferred"
    note: "Other flows from the four red-team source computers; may include their ordinary traffic."
  Benign:
    normalized_attack_class: "Benign"
    attack_stage: "Benign"
    confidence: "inferred"
    note: "No red-team label; LANL does not claim the remaining data is attack-free."
