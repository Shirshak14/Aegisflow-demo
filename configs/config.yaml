# Master configuration. Every tunable pipeline parameter lives here, not in source code.
# Override any key on the CLI, e.g. --set model.batch_size=64

paths:
  data_raw: "data/raw"
  data_interim: "data/interim"
  data_processed: "data/processed"
  models: "models"
  reports: "reports"
  configs: "configs"

logging:
  level: "INFO"
  json_file: "reports/logs/pipeline.jsonl"

active_dataset: "cic_ids2017"

windowing:
  window_size_seconds: 60
  stride_seconds: 30
  sequence_length: 10
  # One-based rank among same-host windows whose window_start is strictly after
  # the final input window's window_end; this is not a dataframe-row offset.
  forecast_horizon: 1
  min_flows_per_window: 1
  group_by: "source_ip"

split:
  # Time-based split. Fractions apply to the sorted-by-time window index, never random.
  train_fraction: 0.6
  val_fraction: 0.2
  test_fraction: 0.2

# Defaults for `python -m aegisflow train`. CLI flags (--epochs, --hidden-size, ...) override
# these, and so does `--set model.hidden_size=8`. The values below are exactly the
# hyperparameters of the committed demo model, so `train` with no flags reproduces it.
model:
  type: "lstm"         # lstm (demo model) | attention_lstm | transformer; `train --model` overrides
  hidden_size: 16
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 256
  epochs: 8
  early_stopping_patience: 3

confidence:
  # In the default replay this is a cutoff on the ATTACK probability: alerts with p >= this are
  # labelled LIKELY_ATTACK, lower ones carry confidence_label = uncertain_label. It does not
  # change which alerts fire (that is the validation-selected LSTM threshold in metrics.json).
  # With a multi-task model (`forecast`, or replay.stage_model_dir) it is ALSO the minimum stage
  # probability for a predicted stage; below it the stage is uncertain_label.
  stage_prediction_threshold: 0.5
  uncertain_label: "UNCERTAIN"

risk_scoring:
  weights:
    attack_probability: 0.4
    stage_severity: 0.25
    prediction_confidence: 0.15
    abnormality_score: 0.1
    recent_attack_history: 0.1
  # Severity (0-100) of the PREDICTED stage, used for the stage_severity risk component. The
  # demo LSTM has no stage head and always predicts confidence.uncertain_label, which is not in this
  # table, so the component is 0 unless replay.stage_model_dir is set. `thresholds.high` is not read (high = anything >= medium).
  stage_severity:
    Benign: 0
    Reconnaissance: 30
    Initial Access: 55
    Lateral Movement: 70
    Command and Control: 85
    Exfiltration: 95
    Impact: 90
  thresholds:
    low: 33
    medium: 66
    high: 100

replay:
  default_speed: 1000   # also the speed pre-selected in the dashboard dropdown
  allowed_speeds: [1, 10, 100, 1000]
  # Opt-in: directory (relative to the repo root) of a `python -m aegisflow train-multitask` model.
  # When set, each alert's predicted_stage comes from its stage head (kept only if the stage
  # probability >= confidence.stage_prediction_threshold, else uncertain_label), so the
  # stage_severity risk term and the MITRE lookup apply to live alerts. null = demo behaviour.
  stage_model_dir: null

# Streaming telemetry API (POST /stream/flows). Opt-in: nothing happens until flows are pushed.
stream:
  model_dir: "artifacts/models/cic_ids2017"
  allowed_lateness_seconds: 0   # flows may arrive this many seconds out of order

# NOT read at runtime: uvicorn host/port are given on the command line.
api:
  host: "0.0.0.0"
  port: 8000

database:
  url: "sqlite:///data/processed/aegisflow.db"

# NOT read at runtime: the --sample-size CLI flag is what is used.
sample_size: null   # set via --sample-size for fast dev iterations; null = full dataset
random_seed: 42
