# Registry of dataset adapters. `active_dataset` in config.yaml selects one of these keys.
# raw_dir is where the adapter looks for files; it never writes here.

cic_ids2017:
  display_name: "CIC-IDS2017"
  adapter: "cic_ids2017"
  raw_dir: "data/raw/cic_ids2017"
  format: "csv"
  source_variant: "GeneratedLabelledFlows"   # has IP/timestamp columns, unlike MachineLearningCSV
  official_url: "https://www.unb.ca/cic/datasets/ids-2017.html"
  citation: >
    Sharafaldin, I., Lashkari, A.H., Ghorbani, A.A. (2018). Toward Generating a New
    Intrusion Detection Dataset and Intrusion Traffic Characterization. ICISSP 2018.
  expected_files_glob: "*/*.pcap_ISCX.csv"
  status: "primary"

cic_ids2018:
  display_name: "CSE-CIC-IDS2018"
  adapter: "cic_ids2018"
  raw_dir: "data/raw/cic_ids2018"
  format: "csv"
  official_url: "https://www.unb.ca/cic/datasets/ids-2018.html"
  citation: >
    Canadian Institute for Cybersecurity, CSE-CIC-IDS2018 on AWS, 2018.
  expected_files_glob: "*.csv"
  status: "planned"

unsw_nb15:
  display_name: "UNSW-NB15"
  adapter: "unsw_nb15"
  raw_dir: "data/raw/unsw_nb15"
  format: "csv"
  official_url: "https://research.unsw.edu.au/projects/unsw-nb15-dataset"
  citation: >
    Moustafa, N., Slay, J. (2015). UNSW-NB15: a comprehensive data set for network
    intrusion detection systems. MilCIS 2015.
  expected_files_glob: "UNSW-NB15_*.csv"
  status: "planned"

ctu_13:
  display_name: "CTU-13"
  adapter: "ctu_13"
  raw_dir: "data/raw/ctu_13"
  format: "binetflow"   # Argus bidirectional flows, plain or .gz
  official_url: "https://www.stratosphereips.org/datasets-ctu13"
  citation: >
    Garcia, S., Grill, M., Stiborek, J., Zunino, A. (2014). An empirical comparison of
    botnet detection methods. Computers & Security 45, 100-123.
  expected_files_glob: "**/*.binetflow[.gz]"
  # scenarios: [11, 12]   # optional: load only these CTU-13 scenarios (1-13)
  status: "opt-in prototype"   # never the active_dataset by default; see docs/combined_datasets_feasibility.md

optc:
  display_name: "DARPA OpTC (corrected)"
  adapter: "optc"
  raw_dir: "data/raw/optc/flows"
  labels_dir: "data/raw/optc/labels"
  format: "ecar-json"   # one gzip JSON-lines file per host and day; FLOW events only are used
  official_url: "https://doi.org/10.57745/UXCWOC"
  citation: >
    DARPA OpTC (Five Directions, 2019), https://github.com/FiveDirections/OpTC-data;
    corrected release and labels: Majorczyk, F., Pilastre, B., Dijoud, T. (2025). A New Hope
    for DARPA OpTC. ACSAC 2025 Workshops. doi:10.57745/UXCWOC
  expected_files_glob: "**/*ecar-YYYY-MM-DD-sysclientNNNN[.flows].json.gz"
  # hosts: [201, 402]      # optional: load only these sysclient numbers
  # keep_telemetry: false  # sensor -> Kafka (port 9092) flows are dropped by default
  status: "opt-in prototype"   # never the active_dataset by default; see docs/optc_lanl_feasibility.md

lanl_2015:
  display_name: "LANL Comprehensive Multi-Source Cyber-Security Events (2015)"
  adapter: "lanl_2015"
  raw_dir: "data/raw/lanl"
  format: "csv.gz"   # flows.txt.gz (router flows) + redteam.txt.gz (red-team authentications)
  official_url: "https://csr.lanl.gov/data/cyber1/"
  citation: >
    Kent, A.D. (2015). Comprehensive, Multi-Source Cyber-Security Events. Los Alamos
    National Laboratory. doi:10.17021/1179829
  expected_files_glob: "flows.txt.gz"
  # computers: [C17693, C1003]   # optional: keep only flows touching these computers
  # time_range_s: [150000, 250000]
  # contact_slack_s: 3600        # RedTeam = red-team source -> victim flows from first red-team auth minus this
  status: "opt-in prototype"   # never the active_dataset by default; see docs/optc_lanl_feasibility.md
